name: Post Facebook & Instagram Reels

on:
  schedule:
    # 5 posts per day in IST (UTC+5:30):
    # 02:30 UTC = 08:00 AM IST (Morning Devotion & Inspiration)
    # 06:30 UTC = 12:00 PM IST (Midday Lunch Break)
    # 09:30 UTC = 03:00 PM IST (Afternoon Scroll)
    # 13:30 UTC = 07:00 PM IST (Peak Evening Reach)
    # 16:30 UTC = 10:00 PM IST (Night Relaxing Hours)
    - cron: '30 2 * * *'
    - cron: '30 6 * * *'
    - cron: '30 9 * * *'
    - cron: '30 13 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  post_reels:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-core fonts-deva

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Post Reels
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ secrets.META_FB_PAGE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          DRY_RUN: 'false'
        run: |
          python main.py post

      - name: Commit & push updated posted_topics history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_topics.json
          git commit -m "chore: record posted topic history [skip ci]" || echo "No changes to commit"
          git push
